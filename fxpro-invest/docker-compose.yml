services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fxpro_invest
      POSTGRES_USER: fxpro
      POSTGRES_PASSWORD: fxpro_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxpro -d fxpro_invest"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://fxpro:fxpro_password@postgres:5432/fxpro_invest
      FRONTEND_URL: http://localhost:3000
      FRONTEND_URLS: http://localhost:3000,http://127.0.0.1:3000,http://bluepeak-capital.online:3000
    command: sh -c "npm run migration:run && npm run seed:users && npm run start"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
